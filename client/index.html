<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>KrishiSetu</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;background:#f3f8f4;color:#1f2d24}
nav{background:#2e7d4f;color:#fff;display:flex;gap:8px;align-items:center;padding:10px 16px;flex-wrap:wrap}nav b{font-size:18px;margin-right:auto}
nav button{background:transparent;color:#fff;border:1px solid #ffffff88;padding:6px 12px;border-radius:8px;cursor:pointer}nav button.on{background:#fff;color:#2e7d4f}
main{max-width:980px;margin:18px auto;padding:0 14px}.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px #0002;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.stats{display:flex;gap:12px;margin-bottom:12px}.stats div{flex:1;background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px #0002;text-align:center}.stats b{display:block;font-size:26px;color:#2e7d4f}
input,select{padding:8px;border:1px solid #ccd;border-radius:8px;width:100%;margin:4px 0}.btn{background:#2e7d4f;color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer}.btn.red{background:#c0392b}.row{display:flex;gap:8px;flex-wrap:wrap}
.tag{padding:2px 10px;border-radius:99px;font-size:12px;background:#eee}.accepted{background:#cdeedb}.pending{background:#ffe8b0}.rejected{background:#f7cfcf}.err{color:#c0392b}.ok{color:#1e7b4a}.auth{max-width:380px;margin:60px auto}
</style></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
